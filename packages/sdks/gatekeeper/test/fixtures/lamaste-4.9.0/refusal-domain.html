<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not allowed — alpha.example</title>
  <style>
    :root { --accent: #22d3ee; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      background: #09090b; color: #e4e4e7;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #18181b; border: 1px solid #27272a; border-radius: 0.75rem;
      max-width: 560px; width: 100%; padding: 2rem;
    }
    .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; color: #f4f4f5; margin-bottom: 0.5rem; }
    .fqdn { color: var(--accent); }
    .subtitle { color: #a1a1aa; font-size: 0.875rem; margin-bottom: 1rem; }
    .contact { color: #a1a1aa; font-size: 0.8125rem; margin-top: 1.5rem; }
    .contact + .contact { margin-top: 0.375rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128683;</div>
    <h1>Not a member of <span class="fqdn">alpha.example</span></h1>
    <p class="subtitle">
      Your account is signed in, but it is not a member of this domain, so none of its
      applications are open to it. Ask Ops to add you if you should have access.
    </p>
    <p class="subtitle">
      <a href="https://auth.alpha.example/logout">Sign out</a> to sign in with another account.
    </p>
    <p class="contact">Admin: <a href="mailto:ops@alpha.example">ops@alpha.example</a></p>
  </div>
</body>
</html>
