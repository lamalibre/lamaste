# Rate limit zone for user access authorize endpoint (5 requests/minute per IP)
limit_req_zone $binary_remote_addr zone=user_access_auth:1m rate=5r/m;

server {
    listen 443 ssl;
    server_name auth.alpha.example;

    ssl_certificate /etc/letsencrypt/live/auth.alpha.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.alpha.example/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Invitation page — the domain's own when it has a brand (its rendering
    # holds one, served through the same link as the overrides below), else
    # the stock page. A link carries its token in the fragment
    # (`/invite#<token>`, nothing for a log to keep); a 4.8 link's token is
    # in the path (`/invite/<token>`). Core's headers: the page's CSP by
    # hash, no framing, no caching.
    location = /invite {
        root /var/www/lamaste/auth/alpha.example;
        try_files /invite/index.html @invite;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-pixI+wRkHhjfeOJKaFD83ddHgzASCCqVjnXFuWoK3Bg='; style-src 'self' 'sha256-m1aOyPnqSkDHuUkgF8vVr3tl5jMZUM1PSL8xEhm/QOk='; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /invite/ {
        root /var/www/lamaste/auth/alpha.example;
        try_files /invite/index.html @invite;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-pixI+wRkHhjfeOJKaFD83ddHgzASCCqVjnXFuWoK3Bg='; style-src 'self' 'sha256-m1aOyPnqSkDHuUkgF8vVr3tl5jMZUM1PSL8xEhm/QOk='; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location @invite {
        root /var/www/lamaste/invite;
        try_files /index.html =404;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-pixI+wRkHhjfeOJKaFD83ddHgzASCCqVjnXFuWoK3Bg='; style-src 'self' 'sha256-m1aOyPnqSkDHuUkgF8vVr3tl5jMZUM1PSL8xEhm/QOk='; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The inviter's page of delegated invitations
    # (`/invitations/<route>`), the same way.
    location /invitations/ {
        root /var/www/lamaste/auth/alpha.example;
        try_files /invitations/index.html @invitations;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-uym+u+JA9kKpbjndVR6BBArUCS+rNdBRgr3SovrarkU='; style-src 'self' 'sha256-m1aOyPnqSkDHuUkgF8vVr3tl5jMZUM1PSL8xEhm/QOk='; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location @invitations {
        root /var/www/lamaste/invitations;
        try_files /index.html =404;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-uym+u+JA9kKpbjndVR6BBArUCS+rNdBRgr3SovrarkU='; style-src 'self' 'sha256-m1aOyPnqSkDHuUkgF8vVr3tl5jMZUM1PSL8xEhm/QOk='; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Invitation API — proxied to panel server (no mTLS). Host is this
    # portal's literal name and X-Forwarded-Host cleared: the panel answers
    # a delegated invitation's token only on its own domain's portal.
    location /api/invite/ {
        proxy_pass http://127.0.0.1:3100/api/invite/;
        proxy_set_header Host auth.alpha.example;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A relay assertion comes only from Gatekeeper, on a plugin's user surface
        proxy_set_header X-Lamalibre-Relay-Assertion "";
        client_max_body_size 16k;
    }

    # The inviter's API of delegated invitations (delegated-invitations-design.md)
    location = /internal/lamaste/delegated-invitations-authz {
        internal;
        auth_request off;

        proxy_pass http://127.0.0.1:9294/authz/delegated-invitations/alpha.example;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL https://auth.alpha.example$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Uri "";
        proxy_set_header X-Forwarded-Method "";
        proxy_set_header Host auth.alpha.example;
        proxy_set_header Cookie $http_cookie;

        proxy_http_version 1.1;
    }

    location = /internal/lamaste/delegated-invitations-401 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 401 '{"error":"unauthenticated"}';
    }

    location = /internal/lamaste/delegated-invitations-403 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 403 '{"error":"forbidden"}';
    }

    location ^~ /api/delegated-invitations/ {
        auth_request /internal/lamaste/delegated-invitations-authz;
        auth_request_set $relay_assertion $upstream_http_x_lamalibre_relay_assertion;

        # The inviter, vouched for by Gatekeeper to the panel for this one request
        proxy_set_header X-Lamalibre-Relay-Assertion $relay_assertion;

        # Nothing else that any part of the panel trusts
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Name "";
        proxy_set_header Remote-Email "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-DN "";
        proxy_set_header X-SSL-Client-Serial "";
        proxy_set_header X-Forwarded-Host "";

        proxy_set_header Host auth.alpha.example;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # No URI: the request target reaches the panel as the browser sent it
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        client_max_body_size 16k;

        error_page 401 = /internal/lamaste/delegated-invitations-401;
        error_page 403 = /internal/lamaste/delegated-invitations-403;
    }

    # User access authorization — Authelia forward auth protects this endpoint
    # so Remote-User header is set by Authelia on successful authentication.
    location /internal/authelia/authz {
        internal;

        proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header X-Original-Method $request_method;
        # This vhost's hostname, never the client's Host header
        proxy_set_header X-Original-URL https://auth.alpha.example$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Uri "";
        proxy_set_header X-Forwarded-Method "";

        proxy_http_version 1.1;
        proxy_buffers 4 32k;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    location /api/user-access/authorize {
        limit_req zone=user_access_auth burst=3 nodelay;

        # Clear client-supplied identity headers (Authelia re-injects on success)
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Name "";
        proxy_set_header Remote-Email "";

        auth_request /internal/authelia/authz;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $redirection_url $upstream_http_location;

        proxy_set_header Remote-User $user;

        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A relay assertion comes only from Gatekeeper, on a plugin's user surface
        proxy_set_header X-Lamalibre-Relay-Assertion "";

        error_page 401 =302 $redirection_url;
    }

    # Brand overrides (packages/core/docs/auth-branding-design.md): the
    # domain's file when it has one, else Authelia's own. The root is a link
    # to the rendering that serves, switched by rename — disable_symlinks
    # stays off. The headers apply to a file served from here alone: the
    # fallback is produced in @authelia, which adds none. The content type
    # comes from the extension, never from the bytes.
    location = /favicon.ico {
        root /var/www/lamaste/auth/alpha.example;
        try_files $uri @authelia;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location = /static/media/logo.png {
        root /var/www/lamaste/auth/alpha.example;
        try_files $uri @authelia;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location /locales/ {
        root /var/www/lamaste/auth/alpha.example;
        try_files $uri @authelia;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location = /brand.css {
        root /var/www/lamaste/auth/alpha.example;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Authelia's own answer for an override the domain lacks (a location
    # that sets any header inherits none of the server's).
    location @authelia {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host auth.alpha.example;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host auth.alpha.example;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Default — proxy to Authelia. Authelia takes the OIDC issuer and the
    # session cookie's domain from X-Forwarded-Host / -Proto: this portal's
    # own name, never what the client sent. (A location that sets any
    # header inherits none of the server's.)
    location / {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host auth.alpha.example;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host auth.alpha.example;
        proxy_set_header X-Forwarded-Proto https;

        # The index HTML, as Authelia renders it for every domain, made this
        # domain's: its theme, its stylesheet, its logo switch. Uncompressed
        # from Authelia so the filter sees the text; text/html only (the
        # module's default).
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter 'data-theme="light"' 'data-theme="light"';
        sub_filter 'data-logooverride="true"' 'data-logooverride="false"';
    }
}
