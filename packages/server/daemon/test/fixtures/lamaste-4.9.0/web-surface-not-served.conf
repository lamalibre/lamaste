server {
    listen 443 ssl;
    server_name app.beta.example;

    ssl_certificate /etc/letsencrypt/live/app.beta.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.beta.example/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # The web surface of plugin "demo" is not served now (not installed,
    # not approved, not hosted, or its version declares no web surface)
    location / {
        if ($http_service_worker) {
            return 404;
        }
        add_header Cache-Control no-store always;
        add_header Clear-Site-Data '"storage"' always;
        return 503;
    }
}
