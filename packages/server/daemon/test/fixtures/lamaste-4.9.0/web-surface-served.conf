server {
    listen 443 ssl;
    server_name app.beta.example;

    ssl_certificate /etc/letsencrypt/live/app.beta.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.beta.example/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/lamaste/apps/demo/current;
    index index.html;

    # Every path of the shell: Gatekeeper first (the API's locations ask on their own)
    auth_request /internal/lamaste/shell-authz;
    error_page 401 =302 https://auth.beta.example/?rd=https://app.beta.example$request_uri;
    error_page 403 = /internal/lamaste/shell-authz;

    location = /internal/lamaste/shell-authz {
        internal;
        # A subrequest is never authorized itself (a host may authorize at server level)
        auth_request off;

        proxy_pass http://127.0.0.1:9294/authz/user-surface-shell/app.beta.example;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL https://app.beta.example$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Uri "";
        proxy_set_header X-Forwarded-Method "";
        proxy_set_header Host app.beta.example;
        proxy_set_header Cookie $http_cookie;

        proxy_http_version 1.1;
    }

    # The user surface of agent-hosted plugins on this host: Gatekeeper
    # vouches for the session's user to the panel, for one request each.
    location = /internal/lamaste/user-surface-authz {
        internal;
        # A subrequest is never authorized itself (a host may authorize at server level)
        auth_request off;

        proxy_pass http://127.0.0.1:9294/authz/user-surface/app.beta.example;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL https://app.beta.example$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Uri "";
        proxy_set_header X-Forwarded-Method "";
        proxy_set_header Host app.beta.example;
        proxy_set_header Cookie $http_cookie;

        proxy_http_version 1.1;
    }

    location = /internal/lamaste/user-surface-403 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($lamaste_refusal = not_a_member) {
            return 403 '{"error":"not_a_member"}';
        }
        return 403 '{"error":"forbidden"}';
    }

    location = /internal/lamaste/user-surface-401 {
        internal;
        auth_request off;

        proxy_pass http://127.0.0.1:9294/authz/user-surface-unauthenticated;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        # Gatekeeper's rate limit counts the client nginx saw, never one a client named
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_http_version 1.1;
    }

    # The user surface of plugin "demo"
    location = /api/demo/app {
        auth_request /internal/lamaste/user-surface-authz;
        auth_request_set $relay_assertion $upstream_http_x_lamalibre_relay_assertion;
        auth_request_set $lamaste_refusal $upstream_http_x_lamalibre_refusal;

        # The user, vouched for by Gatekeeper to the panel for this one request
        proxy_set_header X-Lamalibre-Relay-Assertion $relay_assertion;

        # Nothing else that any part of the panel trusts
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Name "";
        proxy_set_header Remote-Email "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-DN "";
        proxy_set_header X-SSL-Client-Serial "";
        proxy_set_header X-Forwarded-Host "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # No URI: the request target reaches the panel as the browser sent it
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        client_max_body_size 10m;
        # No response lives longer (the panel ends one then)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # No session: a JSON 401, never a redirect; refused: the refusal as JSON
        error_page 401 = /internal/lamaste/user-surface-401;
        error_page 403 = /internal/lamaste/user-surface-403;
    }

    location ^~ /api/demo/app/ {
        auth_request /internal/lamaste/user-surface-authz;
        auth_request_set $relay_assertion $upstream_http_x_lamalibre_relay_assertion;
        auth_request_set $lamaste_refusal $upstream_http_x_lamalibre_refusal;

        # The user, vouched for by Gatekeeper to the panel for this one request
        proxy_set_header X-Lamalibre-Relay-Assertion $relay_assertion;

        # Nothing else that any part of the panel trusts
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Name "";
        proxy_set_header Remote-Email "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-DN "";
        proxy_set_header X-SSL-Client-Serial "";
        proxy_set_header X-Forwarded-Host "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # No URI: the request target reaches the panel as the browser sent it
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        client_max_body_size 10m;
        # No response lives longer (the panel ends one then)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # No session: a JSON 401, never a redirect; refused: the refusal as JSON
        error_page 401 = /internal/lamaste/user-surface-401;
        error_page 403 = /internal/lamaste/user-surface-403;
    }

    # A script, style, font or image the current tree lacks: the previous
    # tree's (a page still running the old shell), else 404
    location ~* [.](?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|ico)$ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        if ($http_service_worker) {
            return 404;
        }

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control no-cache always;
        types {
            text/html html;
            text/css css;
            text/javascript js mjs;
            application/json json;
            application/manifest+json webmanifest;
            text/plain txt;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/svg+xml svg;
            image/x-icon ico;
            image/webp webp;
            image/avif avif;
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            font/otf otf;
        }
        try_files $uri @previous;
    }

    # Everything else: the current tree's file, else the shell
    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        if ($http_service_worker) {
            return 404;
        }

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control no-cache always;
        types {
            text/html html;
            text/css css;
            text/javascript js mjs;
            application/json json;
            application/manifest+json webmanifest;
            text/plain txt;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/svg+xml svg;
            image/x-icon ico;
            image/webp webp;
            image/avif avif;
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            font/otf otf;
        }
        try_files $uri /index.html;
    }

    location @previous {

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control no-cache always;
        types {
            text/html html;
            text/css css;
            text/javascript js mjs;
            application/json json;
            application/manifest+json webmanifest;
            text/plain txt;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/svg+xml svg;
            image/x-icon ico;
            image/webp webp;
            image/avif avif;
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            font/otf otf;
        }
        root /var/www/lamaste/apps/demo/previous;
        try_files $uri =404;
    }
}
