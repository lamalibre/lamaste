<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lamaste — Accept Invitation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: var(--lamaste-page-background, #09090b); color: var(--lamaste-page-text, #a1a1aa);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--lamaste-page-card, #18181b); border: 1px solid var(--lamaste-page-border, #27272a); border-radius: 0.75rem;
      max-width: 520px; width: 100%; padding: 2.5rem;
    }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-logo { max-width: 160px; max-height: 80px; margin-bottom: 0.75rem; }
    .brand-name { color: var(--lamaste-page-heading, #f4f4f5); font-size: 1rem; font-weight: 700; }
    .brand-tagline { font-size: 0.8125rem; margin-top: 0.25rem; }
    .icon { text-align: center; font-size: 3rem; margin-bottom: 1rem; }
    h1 { color: var(--lamaste-page-heading, #f4f4f5); font-size: 1.25rem; text-align: center; margin-bottom: 0.5rem; }
    h2 { color: var(--lamaste-page-heading, #f4f4f5); font-size: 0.9375rem; margin: 2rem 0 0.75rem; }
    .subtitle { text-align: center; margin-bottom: 2rem; font-size: 0.875rem; line-height: 1.6; }
    .field { margin-bottom: 1.25rem; }
    .field label {
      display: block; font-size: 0.8125rem; color: var(--lamaste-page-text, #a1a1aa);
      margin-bottom: 0.375rem; font-weight: 600;
    }
    .field input, .field select {
      width: 100%; padding: 0.625rem 0.875rem;
      background: var(--lamaste-page-input, #09090b); border: 1px solid var(--lamaste-page-border, #27272a); border-radius: 0.5rem;
      color: var(--lamaste-page-heading, #f4f4f5); font-family: inherit; font-size: 0.875rem;
      outline: none; transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus { border-color: var(--lamaste-page-accent, #22d3ee); }
    .field input:disabled, .field input[readonly] { color: var(--lamaste-page-disabled, #71717a); }
    .field .hint { font-size: 0.75rem; color: var(--lamaste-page-hint, #52525b); margin-top: 0.25rem; }
    .error-msg {
      background: var(--lamaste-page-error-background, #1c0f0f); border: 1px solid var(--lamaste-page-error-border, #7f1d1d); border-radius: 0.5rem;
      padding: 0.75rem 1rem; margin-bottom: 1.25rem;
      font-size: 0.8125rem; color: var(--lamaste-page-error-text, #fca5a5);
    }
    .note-msg {
      background: var(--lamaste-page-note-background, #0f1c1c); border-color: var(--lamaste-page-note-border, #134e4a); color: var(--lamaste-page-note-text, #5eead4);
    }
    .success-card { text-align: center; }
    .success-card h1 { color: var(--lamaste-page-success, #4ade80); margin-bottom: 1rem; }
    .success-card p { margin-bottom: 1.5rem; font-size: 0.875rem; line-height: 1.6; }
    .accent { color: var(--lamaste-page-accent, #22d3ee); }
    .btn {
      display: block; width: 100%;
      background: var(--lamaste-page-accent, #22d3ee); color: var(--lamaste-page-accent-foreground, #000000); font-weight: 700;
      border: none; border-radius: 0.5rem; padding: 0.75rem;
      font-size: 0.875rem; cursor: pointer; font-family: inherit;
      transition: filter 0.15s;
    }
    .btn:hover { filter: brightness(0.92); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-link { text-decoration: none; text-align: center; margin-top: 1rem; }
    .btn-outline {
      background: transparent; border: 1px solid var(--lamaste-page-border, #27272a); color: var(--lamaste-page-text, #a1a1aa);
    }
    .btn-outline:hover { border-color: var(--lamaste-page-accent, #22d3ee); color: var(--lamaste-page-heading, #f4f4f5); }
    .btn-small { display: inline-block; width: auto; padding: 0.25rem 0.625rem; font-size: 0.75rem; }
    .row { display: flex; gap: 0.5rem; }
    .row input { flex: 1; }
    .loading {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 3rem 0; font-size: 0.875rem;
    }
    .spinner {
      width: 1.25rem; height: 1.25rem;
      border: 2px solid var(--lamaste-page-border, #27272a); border-top-color: var(--lamaste-page-accent, #22d3ee);
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .detail-row {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 0.5rem 0; border-bottom: 1px solid var(--lamaste-page-border, #27272a);
      font-size: 0.8125rem;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--lamaste-page-muted, #71717a); }
    .detail-value { color: var(--lamaste-page-heading, #f4f4f5); font-weight: 500; text-align: right; word-break: break-all; }
    .details-box {
      background: var(--lamaste-page-input, #09090b); border: 1px solid var(--lamaste-page-border, #27272a); border-radius: 0.5rem;
      padding: 0.75rem 1rem; margin-bottom: 1.5rem;
    }
    .qr {
      display: flex; justify-content: center; margin: 0 auto 1.5rem;
      background: #fff; border-radius: 0.5rem; padding: 1rem; max-width: 220px;
    }
    .qr img { width: 100%; height: auto; }
    .manual { font-size: 0.75rem; color: var(--lamaste-page-muted, #71717a); margin-bottom: 1rem; word-break: break-all; }
    .manual strong { color: var(--lamaste-page-text, #a1a1aa); }
    .muted { color: var(--lamaste-page-muted, #71717a); font-size: 0.75rem; }
    #bounds { margin-bottom: 1rem; }
    #result:not(:empty) { margin-top: 1rem; }
    .back { display: inline-block; margin-top: 1.5rem; font-size: 0.8125rem; color: var(--lamaste-page-accent, #22d3ee); }
  </style>
</head>
<body>
  <div class="card">
    <div id="app">
      <div class="loading">
        <div class="spinner"></div>
        Loading invitation…
      </div>
    </div>
  </div>
  <script>
    (function () {
      'use strict';
      var app = document.getElementById('app');
      var TOKEN_RE = /^[a-f0-9]{64}$/;
      var USERNAME_RE = /^[a-z0-9][a-z0-9_-]*$/;
      var QR_PREFIX = 'data:image/svg+xml;base64,';

      // The token: the link's fragment, or — a 4.8 link — the last segment
      // of /invite/<token>. Nothing else of the URL is read. Then it leaves
      // the address bar and the history: the link is a secret.
      var token = null;
      var fragment = window.location.hash.slice(1);
      var segments = window.location.pathname.split('/').filter(function (s) { return s !== ''; });
      if (TOKEN_RE.test(fragment)) {
        token = fragment;
      } else if (segments.length === 2 && segments[0] === 'invite' && TOKEN_RE.test(segments[1])) {
        token = segments[1];
      }
      try { window.history.replaceState(null, '', '/invite/'); } catch (e) { /* not fatal */ }
      if (!token) {
        showError('This invitation link is not valid.');
        return;
      }

      post('/api/invite/lookup', { token: token })
        .then(function (data) {
          if (data.kind === 'delegated') showDelegatedForm(data);
          else showAdminForm(data);
        })
        .catch(function (err) { showError(err.message); });

      function post(path, body) {
        return fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(body)
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            if (res.ok) return data;
            throw new Error(typeof data.error === 'string' ? data.error : 'The request failed.');
          });
        });
      }

      function text(value) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(String(value)));
        return div.innerHTML;
      }

      function formatDate(iso) {
        var date = new Date(iso);
        return isNaN(date.getTime()) ? '' : date.toLocaleString(undefined, {
          year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      }

      function row(label, value) {
        return '<div class="detail-row"><span class="detail-label">' + text(label) +
          '</span><span class="detail-value">' + text(value) + '</span></div>';
      }

      function field(id, label, type, hint) {
        return '<div class="field"><label for="' + id + '">' + text(label) + '</label>' +
          '<input type="' + type + '" id="' + id + '">' +
          (hint ? '<div class="hint">' + text(hint) + '</div>' : '') + '</div>';
      }

      function showError(message) {
        app.innerHTML =
          '<div class="icon">⚠️</div>' +
          '<h1>Invitation Unavailable</h1>' +
          '<p class="subtitle">' + text(message) + '</p>';
      }

      function passwordFields() {
        return field('password', 'Password', 'password', 'At least 8 characters') +
          field('confirm-password', 'Confirm password', 'password', '');
      }

      function showAdminForm(data) {
        app.innerHTML =
          '<div class="icon">✉️</div>' +
          '<h1>You’ve Been Invited</h1>' +
          '<p class="subtitle">Set your password to create your account.</p>' +
          '<div class="details-box">' +
            row('Username', data.username) + row('Email', data.email) +
            row('Expires', formatDate(data.expiresAt)) +
          '</div>' +
          '<div id="form-error"></div>' +
          '<form id="accept-form">' + passwordFields() +
          '<button type="submit" class="btn" id="submit-btn">Create Account</button></form>';
        bindForm(function () { return {}; });
      }

      function showDelegatedForm(data) {
        var who = data.invitedBy ? text(data.invitedBy) + ' invited you' : 'You are invited';
        app.innerHTML =
          '<div class="icon">✉️</div>' +
          '<h1>You’ve Been Invited</h1>' +
          '<p class="subtitle">' + who + ' to <strong class="accent">' + text(data.plugin) +
            '</strong> as <strong>' + text(data.role) + '</strong>.</p>' +
          '<div class="details-box">' +
            row('Email', data.email) + row('Expires', formatDate(data.expiresAt)) +
          '</div>' +
          '<div id="form-error"></div>' +
          '<form id="accept-form">' +
            field('username', 'Username', 'text',
              'You sign in with it. Lower-case letters, digits, - and _; it cannot be changed later.') +
            field('display-name', 'Your name', 'text', '') +
            passwordFields() +
          '<button type="submit" class="btn" id="submit-btn">Create Account</button></form>';
        var username = document.getElementById('username');
        username.value = data.suggestedUsername || '';
        username.setAttribute('autocomplete', 'username');
        username.setAttribute('maxlength', '32');
        var name = document.getElementById('display-name');
        name.value = data.displayName || '';
        name.setAttribute('maxlength', '100');
        bindForm(function () {
          var chosen = username.value.trim();
          var shown = name.value.trim();
          if (!USERNAME_RE.test(chosen) || chosen.length < 2 || chosen.length > 32) {
            throw new Error('A username has 2 to 32 lower-case letters, digits, - and _, and starts with a letter or digit.');
          }
          if (shown.length === 0) throw new Error('Enter your name.');
          return { username: chosen, displayName: shown };
        });
      }

      function bindForm(extra) {
        var form = document.getElementById('accept-form');
        var errorDiv = document.getElementById('form-error');
        var submitBtn = document.getElementById('submit-btn');
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var password = document.getElementById('password').value;
          var confirm = document.getElementById('confirm-password').value;
          errorDiv.innerHTML = '';
          var body;
          try {
            body = extra();
            if (password.length < 8) throw new Error('A password has at least 8 characters.');
            if (password.length > 128) throw new Error('A password has at most 128 characters.');
            if (password !== confirm) throw new Error('The passwords do not match.');
          } catch (err) {
            errorDiv.innerHTML = '<div class="error-msg">' + text(err.message) + '</div>';
            return;
          }
          body.token = token;
          body.password = password;
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account…';
          post('/api/invite/accept', body)
            .then(showSuccess)
            .catch(function (err) {
              errorDiv.innerHTML = '<div class="error-msg">' + text(err.message) + '</div>';
              submitBtn.disabled = false;
              submitBtn.textContent = 'Create Account';
            });
        });
      }

      function showSuccess(result) {
        app.className = 'success-card';
        var login = typeof result.loginUrl === 'string' && result.loginUrl.indexOf('https://') === 0
          ? '<a id="login" class="btn btn-link">Go to sign-in</a>' : '';
        var pending = result.accessPending
          ? '<div class="error-msg note-msg">Your access is still being set up — if signing in shows nothing yet, try again in a minute.</div>'
          : '';
        var secret = typeof result.totpUri === 'string' ? (result.totpUri.match(/secret=([A-Z2-7]+)/) || [])[1] : null;
        if (secret) {
          app.innerHTML =
            '<div class="icon">✅</div>' +
            '<h1>Account Created</h1>' +
            '<p>Your account <strong class="accent">' + text(result.username) + '</strong> has been created.</p>' +
            '<p>Scan this QR code with your authenticator app to set up two-factor authentication.</p>' +
            '<div id="qr" class="qr"></div>' +
            '<p class="manual"><strong>Manual entry:</strong> ' + text(secret) + '</p>' +
            '<div class="error-msg note-msg">⚠️ Save this before you leave the page — it is not shown again.</div>' +
            pending + login;
          if (typeof result.totpQr === 'string' && result.totpQr.indexOf(QR_PREFIX) === 0) {
            var img = document.createElement('img');
            img.alt = 'Two-factor QR code';
            img.src = result.totpQr;
            document.getElementById('qr').appendChild(img);
          }
        } else {
          app.innerHTML =
            '<div class="icon">✅</div>' +
            '<h1>Account Created</h1>' +
            '<p>Your account <strong class="accent">' + text(result.username) + '</strong> has been created.</p>' +
            '<p>Ask your administrator to set up two-factor authentication.</p>' +
            pending + login;
        }
        var link = document.getElementById('login');
        if (link) link.href = result.loginUrl;
      }
    })();
  </script>
</body>
</html>
