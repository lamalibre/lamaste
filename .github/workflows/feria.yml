# Publishes a release to Feria — the registry Lamaste installs its
# @lamalibre packages from — byte for byte from the GitHub Release's assets
# (the tarballs release.yml packed at the tag, and release-manifest.json).
# release.yml calls it after creating the Release; run it by hand to
# publish a release again (Feria rebuilt from the Releases) or to check one:
#
#   gh workflow run feria.yml -R lamalibre/lamaste --ref v<version>
#   gh workflow run feria.yml -R lamalibre/lamaste --ref v<version> -f dry_run=true
#
# The second form proves the login and reports each package's state
# (already on Feria, would be published, refused) without publishing.
# Releases before 4.14.0 carry no packed tarballs and cannot be published
# this way.
#
# Feria's address is FERIA_URL below, the one place it is named: the script
# reads it from the environment, and the job derives the npmrc host from it.
# It is the same registry as LAMALIBRE_REGISTRY_URL in
# packages/core/lib/src/branding.ts.
#
# No registry secret is stored in GitHub: the job exchanges its OIDC token
# (audience = FERIA_URL) at Feria's login. Feria grants `publish` only to
# refs/tags/v* of repositories owned by the lamalibre organisation, through
# the rule for GitHub's issuer (https://token.actions.githubusercontent.com)
# in its auth.json — and that rule names the audience, so the address here
# and the audience there must be the same URL. A login that answers 401
# right after the address changed means the rule still names the previous
# one; curl failing on the certificate (exit 60) means the host no longer
# serves Feria at all. The token is revoked when the job ends. See
# .github/scripts/publish-to-feria.mjs for what is published, skipped or
# refused.
name: Publish to Feria

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Prove the login and report each package, publish nothing'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prove the login and report each package, publish nothing'
        type: boolean
        default: false

env:
  FERIA_URL: https://feria.codelama.com.tr

permissions:
  contents: read # download the Release's assets
  id-token: write # the OIDC token exchanged at Feria

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Run on a release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != tag ] || [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            echo "::error::run this workflow on a release tag (--ref v<version>), not ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          # Publishing installs nothing; no package-manager cache to set up.
          package-manager-cache: false

      - name: Download the release's packed tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/release" --pattern '*.tgz' --pattern 'release-manifest.json'
          ls -l "${RUNNER_TEMP}/release"

      - name: Feria token from the job's OIDC identity
        id: feria
        run: |
          set -euo pipefail
          host="${FERIA_URL#*://}"; host="${host%%/*}"
          jwt="$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${FERIA_URL}" | jq -r .value)"
          echo "::add-mask::${jwt}"
          # Feria labels allow letters, digits, space and . _ @ / -, up to 64.
          label="gha ${GITHUB_REPOSITORY} run ${GITHUB_RUN_ID}"
          status="$(jq -n --arg a "$jwt" --arg l "${label:0:64}" \
            '{assertion: $a, label: $l}' \
            | curl -sS -o "${RUNNER_TEMP}/feria-login.json" -w '%{http_code}' -X POST \
                -H 'content-type: application/json' --data-binary @- "${FERIA_URL}/-/feria/login")"
          if [ "$status" != 201 ]; then
            echo "::error::Feria login answered HTTP ${status}: $(jq -c '{error, details}' "${RUNNER_TEMP}/feria-login.json" 2>/dev/null || head -c 500 "${RUNNER_TEMP}/feria-login.json")"
            rm -f "${RUNNER_TEMP}/feria-login.json"
            exit 1
          fi
          issued="$(cat "${RUNNER_TEMP}/feria-login.json")"
          rm -f "${RUNNER_TEMP}/feria-login.json"
          token="$(jq -r .token <<<"$issued")"
          echo "::add-mask::${token}"
          echo "Feria token $(jq -r '.id + " for " + .owner + " (" + (.scopes | join(",")) + "), expires " + .expiresAt' <<<"$issued")"
          echo "id=$(jq -r .id <<<"$issued")" >> "$GITHUB_OUTPUT"
          umask 077
          printf '//%s/:_authToken=%s\n' "$host" "$token" > "${RUNNER_TEMP}/feria.npmrc"

      - name: Publish the release's tarballs to Feria
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          node .github/scripts/publish-to-feria.mjs "${GITHUB_REF_NAME#v}" \
            --dir "${RUNNER_TEMP}/release" --npmrc "${RUNNER_TEMP}/feria.npmrc" "${args[@]}"

      - name: Revoke the Feria token
        if: ${{ always() && steps.feria.outputs.id != '' }}
        run: |
          host="${FERIA_URL#*://}"; host="${host%%/*}"
          token="$(sed -n "s|^//${host}/:_authToken=||p" "${RUNNER_TEMP}/feria.npmrc")"
          curl -sS -o /dev/null -w 'revoke %{http_code}\n' -X DELETE -H @- \
            "${FERIA_URL}/-/feria/tokens/${{ steps.feria.outputs.id }}" \
            <<<"Authorization: Bearer ${token}"
          rm -f "${RUNNER_TEMP}/feria.npmrc"
